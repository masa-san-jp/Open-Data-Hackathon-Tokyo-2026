<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b3d59">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; base-uri 'none'; form-action 'none'">
<title>まちかどQR — ここはどこ</title>
<style>
__STYLES__
</style>
</head>
<body>
<main class="wrap">
  <header class="toolbar">
    <label class="sr-only" for="lang">Language</label>
    <select id="lang" aria-label="Language"></select>
    <span class="demo-badge" id="demo-badge" hidden>DEMO</span>
  </header>
  <div id="app"></div>
  <footer>
    <details>
      <summary id="source-summary"></summary>
      <div id="source-list" class="source-list"></div>
    </details>
  </footer>
</main>

<dialog id="confirm-dialog" aria-labelledby="confirm-title">
  <div class="dialog-title" id="confirm-title"></div>
  <div class="dialog-copy" id="confirm-copy"></div>
  <div class="dialog-actions">
    <button class="dialog-primary emergency" id="confirm-go" type="button"></button>
    <button class="dialog-secondary" id="confirm-cancel" type="button"></button>
  </div>
</dialog>

<dialog id="profile-dialog" aria-labelledby="profile-title">
  <div class="dialog-title" id="profile-title"></div>
  <p class="dialog-copy" id="profile-copy"></p>
  <form id="profile-form">
    <label class="field-label" id="kind-label" for="contact-kind"></label>
    <select class="field" id="contact-kind"></select>

    <label class="field-label" id="name-label" for="contact-name"></label>
    <input class="field" id="contact-name" type="text" autocomplete="name" maxlength="40">

    <label class="field-label" id="phone-label" for="contact-phone"></label>
    <input class="field" id="contact-phone" type="tel" inputmode="tel" autocomplete="tel" maxlength="24">

    <label class="field-label" id="home-label" for="home-address"></label>
    <input class="field" id="home-address" type="text" autocomplete="street-address" maxlength="120">

    <label class="field-label" id="home-code-label" for="home-code"></label>
    <input class="field" id="home-code" type="text" autocomplete="off" maxlength="24">
    <p class="field-help" id="home-code-help"></p>
    <p class="form-error" id="profile-error" role="alert"></p>

    <div class="dialog-actions">
      <button class="dialog-primary" id="profile-save" type="submit"></button>
      <button class="dialog-secondary" id="profile-cancel" type="button"></button>
      <button class="dialog-link" id="profile-clear" type="button"></button>
    </div>
  </form>
</dialog>

<dialog id="notice-dialog" aria-labelledby="notice-title">
  <div class="dialog-title" id="notice-title"></div>
  <div class="dialog-copy" id="notice-copy"></div>
  <div class="dialog-actions">
    <button class="dialog-primary" id="notice-close" type="button"></button>
  </div>
</dialog>

<script>
window.__MACHIKADO_DATA__ = __DATA__;
window.__MACHIKADO_CONFIG__ = __CONFIG__;
</script>
<script>
__APP_JS__
</script>
</body>
</html>
