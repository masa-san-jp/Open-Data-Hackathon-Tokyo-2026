# データレジストリ（SPEC.md §5.1）
#
# D0の合成デモデータは data/demo/ に隔離し、ここには登録しない。
# 「存在確認済み」であっても production_ready: true にはしない（AGENTS.md §5.1）。
#
# 登録時の必須項目:
# - id
# - title
# - provider
# - source_url
# - license
# - retrieved_at
# - geography
# - granularity
# - coverage: {area, status}
# - schema_status
# - production_ready
# - notes
#
# M1対象地域: 青梅市（ADR-0007でaccepted）。
# ただし production_ready は対象地域確定だけではtrueにせず、カバー率・道路・標高等を別途監査する。

sources:
  - id: ome_clinic_list_2025
    title: 東京都青梅市における医療機関一覧
    provider: 青梅市
    source_url: https://www.opendata.metro.tokyo.lg.jp/ome/132055_hospital.xlsx
    license: CC-BY-4.0
    retrieved_at: "2026-08-23"
    geography: point
    granularity: facility
    function_code: clinic
    coverage:
      area: 青梅市
      status: single_municipality
    schema_status: verified
    production_ready: false
    notes: >
      138件（無床診療所121・病院14・有床診療所3）。緯度経度欠損0件、標準スキーマ（全国地方公共団体コード等）。
      対象地域が青梅市単独に限定されており、東京都全域の生活機能としては使えない。ADR-0007で対象地域は
      確定したが、全都カバー・道路経路・標高との結合は未監査のため production_ready は false のまま。
      診療科目・薬局の区分は含まない。

