<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ODH Tokyo 2026</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #11131a;
        color: #f2f4f7;
      }

      body {
        display: grid;
        min-height: 100svh;
        margin: 0;
        place-items: center;
        background: radial-gradient(circle at 20% 20%, #35405c 0, transparent 38%), #11131a;
      }

      main {
        width: min(680px, calc(100% - 48px));
        padding: 48px 0;
      }

      p {
        color: #b9c2d4;
        line-height: 1.8;
      }

      h1 {
        margin: 16px 0;
        font-size: clamp(2.8rem, 10vw, 6rem);
        line-height: 0.95;
        letter-spacing: -0.06em;
      }

      h1 span {
        color: #90a9ff;
      }
    </style>
  </head>
  <body>
    <main>
      <p>都知事杯オープンデータ・ハッカソン 2026</p>
      <h1>SILVERPUNK<br /><span>// 2100</span></h1>
      <p>Cloudflare Workers の公開準備ページです。アプリ本体ができたら、このページを差し替えてデプロイします。</p>
    </main>
  </body>
</html>
